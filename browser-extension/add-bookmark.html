<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>添加书签</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background: #f5f7fb;
      padding: 24px;
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: flex-start;
    }
    .container {
      max-width: 480px;
      width: 100%;
      background: #ffffff;
      border-radius: 16px;
      padding: 28px 32px 32px;
      box-shadow: 0 8px 30px rgba(0,0,0,0.08);
      border: 1px solid #eef2f6;
    }
    h2 {
      font-size: 20px;
      font-weight: 600;
      margin-bottom: 20px;
      color: #1e293b;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .form-group {
      margin-bottom: 16px;
    }
    label {
      display: block;
      font-size: 13px;
      font-weight: 500;
      color: #334155;
      margin-bottom: 4px;
    }
    input, textarea, select {
      width: 100%;
      padding: 8px 12px;
      border: 1px solid #d1d9e6;
      border-radius: 8px;
      font-size: 14px;
      font-family: inherit;
      background: #ffffff;
      transition: border-color 0.2s;
      outline: none;
    }
    input:focus, textarea:focus, select:focus {
      border-color: #2563eb;
      box-shadow: 0 0 0 3px rgba(37,99,235,0.1);
    }
    textarea {
      resize: vertical;
      min-height: 60px;
    }
    .hint {
      font-size: 12px;
      color: #64748b;
      margin-top: 4px;
    }
    .actions {
      margin-top: 24px;
      display: flex;
      justify-content: flex-end;
      gap: 10px;
      padding-top: 16px;
      border-top: 1px solid #eef2f6;
    }
    .btn {
      padding: 8px 20px;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 500;
      border: none;
      cursor: pointer;
      transition: background 0.2s;
    }
    .btn-primary {
      background: #2563eb;
      color: #fff;
    }
    .btn-primary:hover {
      background: #1d4ed8;
    }
    .btn-secondary {
      background: #f1f4f9;
      color: #1e293b;
    }
    .btn-secondary:hover {
      background: #e2e8f0;
    }
    .status {
      margin-top: 12px;
      color: #16a34a;
      font-weight: 500;
      display: none;
    }
    .error {
      margin-top: 8px;
      color: #dc2626;
      font-size: 14px;
      display: none;
    }
  </style>
</head>
<body>
<div class="container">
  <h2>📖 添加书签</h2>
  <form id="bookmarkForm">
    <div class="form-group">
      <label for="url">网址</label>
      <input type="url" id="url" required />
    </div>
    <div class="form-group">
      <label for="title">标题</label>
      <input type="text" id="title" />
    </div>
    <div class="form-group">
      <label for="description">描述</label>
      <textarea id="description" rows="2"></textarea>
    </div>
    <div class="form-group">
      <label for="tags">标签</label>
      <input type="text" id="tags" placeholder="多个标签用 / 或 , 分隔，例如：技术/前端/AI" />
      <div class="hint">支持 / 、逗号、顿号、空格分隔</div>
    </div>
    <div class="form-group">
      <label for="category">分类</label>
      <select id="category">
        <option value="">加载分类...</option>
      </select>
    </div>
    <div class="actions">
      <button type="button" class="btn btn-secondary" id="cancelBtn">取消</button>
      <button type="submit" class="btn btn-primary" id="submitBtn">保存</button>
    </div>
  </form>
  <div id="status" class="status"></div>
  <div id="error" class="error"></div>
</div>
<script src="add-bookmark.js"></script>
</body>
</html>
